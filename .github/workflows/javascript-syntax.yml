name: JavaScript syntax

on:
  pull_request:
    paths:
      - '**/*.js'
      - '*.js'
      - '.github/workflows/javascript-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0 | sort -z)
          if [ "$count" -eq 0 ]; then
            echo "No JavaScript files found."
            exit 1
          fi
          echo "Syntax check passed for $count JavaScript files."
